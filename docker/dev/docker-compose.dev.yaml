services:
  spring-app:
    image: ghcr.io/youyeon11/spring-app:latest
    container_name: spring-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - onestep-network
    restart: unless-stopped

  fastapi-app:
    image: ghcr.io/youyeon11/fastapi-app:latest
    container_name: fastapi-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/onestep}
    volumes:
      - ./fastapi/logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - onestep-network
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: onestep-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    env_file:
      - .env
    networks:
      - onestep-network
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: onestep-postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - onestep-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_DB_USER:-root} -d onestep"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.1
    container_name: onestep-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${DEV_REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    env_file:
      - .env
    networks:
      - onestep-network
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: onestep-mongodb
    ports:
      - "27017:27017"
    env_file:
      - .env
    volumes:
      - mongodb_data:/data/db
      - ./init-challenges.js:/docker-entrypoint-initdb.d/init-challenges.js:ro
    networks:
      - onestep-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    image: apache/kafka:latest
    container_name: onestep-kafka
    ports:
      - "9094:9094"
    env_file:
      - .env
    networks:
      - onestep-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  chromadb_data:

networks:
  onestep-network:
    driver: bridge
  monitoring:
    driver: bridge