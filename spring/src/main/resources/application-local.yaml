spring:
  config:
    activate:
      on-profile: "local"

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${LOCAL_DB_URL}?options=-c%20timezone%3DAsia%2FSeoul
    username: ${LOCAL_DB_USER}
    password: ${LOCAL_DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        show_sql: false
        format_sql: true

  jwt:
    access:
      expiration: 604800
    refresh:
      expiration: 604800     # 7일 (7 * 24 * 60 * 60 초)

  data:
    redis:
      host: ${LOCAL_REDIS_HOST}
      port: 6379
      password: ${LOCAL_REDIS_PASSWORD}

    mongodb:
      host: ${LOCAL_MONGO_HOST}
      port: ${LOCAL_MONGO_PORT}
      database: ${LOCAL_MONGO_DB_NAME}
      username: ${LOCAL_MONGO_USERNAME}
      password: ${LOCAL_MONGO_PASSWORD}
      authentication-database: admin

  kafka:
    bootstrap-servers: ${KAFKA_ENDPOINT}
    consumer:
      group-id: onestep-spring-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.a508.onestepapi.kafka.dto.KafkaMessageDto
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

openapi:
  base-url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: onestep-api
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces