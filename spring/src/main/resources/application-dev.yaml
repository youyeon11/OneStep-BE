spring:
  config:
    activate:
      on-profile: "dev"

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres:${POSTGRES_PORT}/onestep?options=-c%20timezone%3DAsia%2FSeoul
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    properties:
      hibernate:
        show_sql: false
        format_sql: true

  jwt:
    access:
      expiration: 604800
    refresh:
      expiration: 604800 

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_HOST}
      password: ${LOCAL_REDIS_PASSWORD}

    mongodb:
      uri: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb.infra.svc.cluster.local:${MONGO_PORT}/onestep_db?authSource=admin
      host: ${MONGO_HOST}
      port: ${MONGO_PORT}
      database: onestep_db
      username: ${MONGO_USERNAME}
      password: ${MONGO_PASSWORD}
      authentication-database: admin

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: onestep-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.a508.onestepapi.kafka.dto.KafkaMessageDto
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    tags:
      application: onestep-api

openapi:
  base-url: http://${SERVER_IP}/api